name: Compiling Test
on:
  push: 
    branches:
      - master
      - features/ci-cd
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '16.4'
        
      - name: Build dll file
        run: msbuild RGM/RGM.sln -t:rebuild -verbosity:diag -property:Configuration=Release